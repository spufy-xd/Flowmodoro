<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowmodoro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0f0f0f; }

    #frame-flowmodoro {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    #countdown-wrapper {
      position: fixed;
      top: 1rem;
      left: 1rem;
      width: 270px;
      z-index: 10;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.03);
    }

    #frame-countdown {
      display: block;
      width: 100%;
      height: 42px; /* corrected by postMessage */
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="frame-flowmodoro" src="Flowmodoro/indexFlowmodoro.html"></iframe>

  <div id="countdown-wrapper">
    <iframe id="frame-countdown" src="countdown/indexCountdown.html" scrolling="no"></iframe>
  </div>

  <script>
    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'countdown-resize') {
        document.getElementById('frame-countdown').style.height = e.data.height + 'px';
      }
    });
  </script>
</body>
</html>

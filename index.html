<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowmodoro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100&family=Syne:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shell.css" />
</head>
<body>

  <!-- Header global del shell -->
  <header id="shell-header">
    <h1>Flowmodoro
      <button id="shell-history-btn" title="Ver historial">⏱</button>
      <button id="shell-cfg-btn" title="Configuración">⚙</button>
      <span id="shell-reset-area">
        <button id="shell-reset-btn" title="Reiniciar todo">↺</button>
        <span id="shell-reset-confirm" hidden>¿Reinicar?&nbsp;<button id="shell-reset-yes-btn">Sí</button><button id="shell-reset-no-btn">No</button></span>
      </span>
    </h1>
  </header>

  <!-- Panel de configuración global -->
  <div id="shell-cfg-panel" hidden>
    <label>
      <input id="shell-break-input" type="number" min="1" max="60" />
      min descanso por cada
      <input id="shell-ratio-input" type="number" min="1" max="60" />
      min trabajo
    </label>
    <label class="sep">
      <input id="shell-bonus-input" type="number" min="0" max="120" />
      min extra por cada
      <input id="shell-bonus-target-input" type="number" min="1" max="480" />
      min seguidos
    </label>
    <label class="sep">
      <input type="checkbox" id="shell-title-check" />
      Mostrar tiempo en título
    </label>
  </div>

  <iframe id="frame-flowmodoro" src="flowmodoro/index.html"></iframe>

  <div id="countdown-area">
    <div id="countdown-container"></div>
    <button id="add-countdown-btn">+ Nueva cuenta atrás</button>
  </div>

  <script src="shell.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuenta atrás</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="module">

    <div id="header-row">
      <button id="collapse-btn" aria-expanded="false">
        <span id="collapse-arrow">▶</span>
        <span id="header-label">Cuenta atrás</span>
        <span id="header-time" hidden></span>
      </button>
      <!-- Solo visible cuando la cuenta está terminada y colapsada -->
      <button id="header-done-delete-btn" hidden title="Eliminar">🗑</button>
    </div>

    <div id="module-content" hidden>

      <div id="setup">
        <div id="setup-top-row">
          <input id="title-input" type="text" placeholder="Título (opcional)" maxlength="60" autocomplete="off" spellcheck="false" />
          <!-- UX5: checkbox de notificación, solo visible en IDLE -->
          <label id="notify-label" title="Recibir notificación del navegador al llegar a 0">
            <input type="checkbox" id="notify-check" />
            🔔
          </label>
        </div>
        <p id="notify-denied-note" hidden>Permiso denegado</p>
        <div id="mode-toggle">
          <button id="mode-time-btn">hora fin</button>
          <button id="mode-dur-btn">duración</button>
        </div>
        <div id="time-row">
          <label id="time-label" for="target-input">¿Hasta qué hora?</label>
          <input id="target-input" type="time" />
        </div>
        <p id="tomorrow-note" hidden></p>
        <!-- UX4: presets de duración, solo visibles en modo duración -->
        <div id="duration-presets" hidden>
          <button class="preset-btn" data-seconds="300">5'</button>
          <button class="preset-btn" data-seconds="600">10'</button>
          <button class="preset-btn" data-seconds="1500">25'</button>
          <button class="preset-btn" data-seconds="3600">1h</button>
          <button id="preset-custom-btn" title="Preset personalizado">+</button>
          <button id="preset-save-btn" hidden title="Guardar como preset ★">Guardar ★</button>
        </div>
        <div id="btn-row">
          <button id="clear-btn" title="Limpiar datos">✕</button>
          <button id="start-btn">▶ Iniciar</button>
          <button id="delete-btn" title="Eliminar temporizador">🗑</button>
        </div>
      </div>

      <div id="running" hidden>
        <div id="title-display"></div>
        <div id="timer">00:00:00</div>
        <p id="end-time-label" hidden></p>
        <div id="running-btn-row">
          <button id="cancel-btn">■ Cancelar</button>
          <!-- Solo visible cuando la cuenta ha terminado (estado DONE) -->
          <button id="done-delete-btn" hidden title="Eliminar temporizador">🗑 Eliminar</button>
        </div>
      </div>

    </div>
  </div>

  <script src="../utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
